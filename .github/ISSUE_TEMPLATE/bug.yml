name: Bug report
description: Report a reproducible problem without sensitive diagnostic data.
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Application version and operating system
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Do not post credentials, private addresses or security vulnerabilities.
